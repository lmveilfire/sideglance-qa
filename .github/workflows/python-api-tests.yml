name: CI Tests Python API

on:
  workflow_dispatch:


jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private app code
        uses: actions/checkout@v4
        with:
          repository: lmveilfire/sideglance
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: ./app

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install all dependencies
        working-directory: python
        run: pip install -r requirements.txt -r requirements-test.txt -r requirements-dev.txt

      - name: Ruff format check
        working-directory: python
        run: ruff format --check .

      - name: Ruff lint
        working-directory: python
        run: ruff check .

      - name: mypy
        working-directory: python
        run:  mypy src/api src/clients src/helpers/auth_helper.py src/helpers/captcha_helper.py src/utils tests/api

      - name: Create .env from secrets
        working-directory: ./app
        run: |
          echo "TEST_ADMIN_USERNAME=${{ secrets.TEST_ADMIN_USERNAME }}" >> .env
          echo "TEST_ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}" >> .env
          echo "TEST_DB_USERNAME=${{ secrets.TEST_DB_USERNAME }}" >> .env
          echo "TEST_DB_PASSWORD=${{ secrets.TEST_DB_PASSWORD }}" >> .env
          echo "APP_FILE_SERVE_SECRET=${{ secrets.APP_FILE_SERVE_SECRET }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "app.allowed-origin=http://localhost" >> .env

      - name: Build frontend for Docker context
        working-directory: ./app/frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm ci
          npm run build:test

      - name: Start services with CI Compose
        working-directory: ./app
        run: docker compose -f docker-compose.tests.yml up -d --build

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Backend ready"
              BACKEND_READY=true
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done

          if [ "$BACKEND_READY" != "true" ]; then
            echo "Backend did not start in time"
            exit 1
          fi

      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost/health > /dev/null; then
              echo "Frontend ready"
              FRONTEND_READY=true
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 3
          done

          if [ "$FRONTEND_READY" != "true" ]; then
            echo "Frontend did not start in time"
            exit 1
          fi

      - name: Run pytest
        working-directory: python
        env:
          API_URL: http://localhost:8080
          BASE_URL: http://localhost
          TEST_ADMIN_USERNAME: ${{ secrets.TEST_ADMIN_USERNAME }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: pytest -m api tests/api

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: python/allure-results
          retention-days: 7

      - name: Stop services (cleanup)
        if: always()
        working-directory: ./app
        run: docker compose -f docker-compose.tests.yml down -v

  publish-report:
    name: Publish Allure report
    needs: tests
    if: ${{ always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results*
          merge-multiple: true
          path: allure-results

      - name: Write Allure executor metadata
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions (Sideglance-qa CI)",
            "type": "github",
            "buildName": "Run #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions"
          }
          EOF

      - name: Get Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: false

      - name: Generate Allure report
        uses: GuitaristForEver/allure-v3-report-action@v1.1.0
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          gh_pages: gh-pages
          report_name: Python API Tests
          subfolder: python-api
          keep_reports: 20

      - name: Fix permissions on report folder
        run: sudo chown -R "$(id -u):$(id -g)" allure-history   

      - name: Publish badge data
        run: |
          TOTAL=$(jq '.stats.total // 0' allure-report/summary.json)
          PASSED=$(jq '.stats.passed // 0' allure-report/summary.json)
          FAILED=$(jq '.stats.failed // 0' allure-report/summary.json)
          BROKEN=$(jq '.stats.broken // 0' allure-report/summary.json)
          FAILED=$((FAILED + BROKEN))

          COLOR=brightgreen
          if [ "$FAILED" -gt 0 ]; then COLOR=red; fi

          echo '{"schemaVersion":1,"label":"Total","message":"'$TOTAL'","color":"blue"}' > allure-history/python-api/badge-total.json
          echo '{"schemaVersion":1,"label":"Passed","message":"'$PASSED'","color":"brightgreen"}' > allure-history/python-api/badge-passed.json
          echo '{"schemaVersion":1,"label":"Failed","message":"'$FAILED'","color":"'$COLOR'"}' > allure-history/python-api/badge-failed.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true
