name: CI Tests Python API

on:
  workflow_dispatch:


jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private app code
        uses: actions/checkout@v4
        with:
          repository: lmveilfire/sideglance
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: ./app

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install all dependencies
        working-directory: python
        run: pip install -r requirements.txt -r requirements-test.txt -r requirements-dev.txt

      - name: Ruff format check
        working-directory: python
        run: ruff format --check .

      - name: Ruff lint
        working-directory: python
        run: ruff check .

      - name: mypy
        working-directory: python
        run:  mypy src/api src/clients src/helpers/auth_helper.py src/helpers/captcha_helper.py src/utils tests/api

      - name: Create .env from secrets
        working-directory: ./app
        run: |
          echo "TEST_ADMIN_USERNAME=${{ secrets.TEST_ADMIN_USERNAME }}" >> .env
          echo "TEST_ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}" >> .env
          echo "TEST_DB_USERNAME=${{ secrets.TEST_DB_USERNAME }}" >> .env
          echo "TEST_DB_PASSWORD=${{ secrets.TEST_DB_PASSWORD }}" >> .env
          echo "APP_FILE_SERVE_SECRET=${{ secrets.APP_FILE_SERVE_SECRET }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "app.allowed-origin=http://localhost" >> .env

      - name: Build frontend for Docker context
        working-directory: ./app/frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm ci
          npm run build:test

      - name: Start services with CI Compose
        working-directory: ./app
        run: docker compose -f docker-compose.tests.yml up -d --build

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Backend ready"
              BACKEND_READY=true
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done

          if [ "$BACKEND_READY" != "true" ]; then
            echo "Backend did not start in time"
            exit 1
          fi

      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost/health > /dev/null; then
              echo "Frontend ready"
              FRONTEND_READY=true
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 3
          done

          if [ "$FRONTEND_READY" != "true" ]; then
            echo "Frontend did not start in time"
            exit 1
          fi

      - name: Run pytest
        working-directory: python
        env:
          API_URL: http://localhost:8080
          BASE_URL: http://localhost
          TEST_ADMIN_USERNAME: ${{ secrets.TEST_ADMIN_USERNAME }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: pytest -m api tests/api

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: python/allure-results
          retention-days: 7

      - name: Stop services (cleanup)
        if: always()
        working-directory: ./app
        run: docker compose -f docker-compose.tests.yml down -v

  publish-report:
    name: Publish Allure report
    needs: tests
    if: ${{ always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results*
          merge-multiple: true
          path: allure-results

      - name: Restore trend history from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Carry over previous history
        run: |
          mkdir -p allure-results/history
          if [ -d gh-pages/python-api/history ]; then
            cp -r gh-pages/python-api/history/* allure-results/history/ || true
          fi

      - name: Write Allure executor metadata
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions (Sideglance CI)",
            "type": "github",
            "reportName": "QA Automation Report",
            "buildName": "Run #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions"
          }
          EOF

      - name: Generate Allure report with history
        run: npx allure generate allure-results -o allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: python-api
