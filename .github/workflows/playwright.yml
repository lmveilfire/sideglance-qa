name: CI Tests Typescript Playwright

on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private app code
        uses: actions/checkout@v4
        with:
          repository: lmveilfire/sideglance
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: ./app

      - name: Create .env from secrets
        working-directory: ./app
        run: |
          echo "TEST_ADMIN_USERNAME=${{ secrets.TEST_ADMIN_USERNAME }}" >> .env
          echo "TEST_ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}" >> .env
          echo "TEST_DB_USERNAME=${{ secrets.TEST_DB_USERNAME }}" >> .env
          echo "TEST_DB_PASSWORD=${{ secrets.TEST_DB_PASSWORD }}" >> .env
          echo "APP_FILE_SERVE_SECRET=${{ secrets.APP_FILE_SERVE_SECRET }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "app.allowed-origin=http://localhost" >> .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: typescript-playwright/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('typescript-playwright/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: typescript-playwright
        run: |
          npm ci
          npm install -D allure-playwright

      - name: Install Playwright browsers
        working-directory: typescript-playwright
        run: npx playwright install --with-deps chromium

      - name: Build frontend for Docker context
        working-directory: ./app/frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm ci
          npm run build:test

      - name: Start services with CI Compose
        working-directory: ./app
        run: docker compose -f docker-compose.tests.yml up -d --build

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/health > /dev/null; then
              echo "Backend ready"
              BACKEND_READY=true
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done
          echo "Backend did not start in time"

          if [ "$BACKEND_READY" = false ]; then
            echo "Backend did not start in time"
            exit 1
          fi

      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost/health > /dev/null; then
              echo "Frontend ready"
              FRONTEND_READY=true
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 3
          done

           if [ "$FRONTEND_READY" = false ]; then
            echo "Frontend did not start in time"
            exit 1
          fi
      - name: Check ports
        run: |
          curl -v http://localhost:8080/api/health
          curl -v http://localhost/health

      - name: Run Playwright tests
        working-directory: typescript-playwright
        env:
          API_URL: http://localhost:8080
          BASE_URL: http://localhost
          TEST_ADMIN_USERNAME: ${{ secrets.TEST_ADMIN_USERNAME }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: typescript-playwright/playwright-report/
          retention-days: 7
          
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: typescript-playwright/allure-results/
          retention-days: 7
          include-hidden-files: true 

      - name: Stop services (cleanup)
        if: always()
        working-directory: ./app
        run: docker compose -f docker-compose.tests.yml down -v